name: Bug report
description: Report a reproducible Avair CLI or MCP setup problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Avair CLI version
      description: Output of `avair --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and installation channel
      placeholder: macOS 15, Homebrew
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Remove tokens, personal data, and customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and customer data from this report.
          required: true
